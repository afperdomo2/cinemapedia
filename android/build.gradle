allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Usa layout.buildDirectory porque Project.buildDir quedó deprecado (y se
// removió en Gradle 9).
def newBuildDir = rootProject.layout.buildDirectory.dir("../../build").get()
rootProject.layout.buildDirectory.value(newBuildDir)

subprojects {
    def newSubprojectBuildDir = newBuildDir.dir(project.name)
    project.layout.buildDirectory.value(newSubprojectBuildDir)
}
subprojects {
    project.evaluationDependsOn(":app")
}

// Algunos plugins viejos (p. ej. isar_flutter_libs 3.x) no declaran
// `namespace` en su build.gradle y AGP 8+ lo exige. Se completa automáticamente
// desde el atributo `package` del AndroidManifest del plugin, al aplicarse el
// plugin de Android. Es inofensivo con plugins modernos: si el plugin declara
// su propio namespace, pisa este valor.
subprojects { project ->
    project.plugins.withId("com.android.library") {
        def androidExt = project.extensions.findByName("android")
        def manifest = new File(project.projectDir, "src/main/AndroidManifest.xml")
        if (androidExt != null && androidExt.namespace == null && manifest.exists()) {
            def matcher = (manifest.text =~ /package="([^"]+)"/)
            if (matcher.find()) {
                androidExt.namespace = matcher.group(1)
            }
        }
    }
}

// isar_flutter_libs 3.x compila contra android-30 y las dependencias androidx
// que resuelve Gradle exigen 34+. Se fija un compileSdk alto en los plugins
// Android, después de su build.gradle y antes de crear las variantes. El
// compileSdk de la app ya lo fija el plugin de Flutter.
subprojects { project ->
    if (project.state.executed) return
    project.afterEvaluate {
        def androidExt = project.extensions.findByName("android")
        if (androidExt != null) {
            androidExt.compileSdk = 36
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
