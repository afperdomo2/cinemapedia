name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  analyze-and-test:
    name: Analizar y testear
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencias
        run: flutter pub get

      - name: Código generado (Isar)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analizar
        run: flutter analyze

      - name: Testear
        run: flutter test

      - name: Formato
        run: dart format --output=none --set-exit-if-changed lib test
