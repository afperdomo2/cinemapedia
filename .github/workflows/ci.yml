name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  analyze-and-test:
    name: Analizar y testear
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Versión fijada a la del entorno de desarrollo (3.47.9). Con
      # `channel: stable` sin versión, un SDK más nuevo deprecó
      # flutter/material.dart y flutter analyze falló por las infos de
      # deprecación. Los upgrades de Flutter se hacen en un PR deliberado.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.9"
          cache: true

      # .env está en .gitignore (contiene la API key de TMDB), pero pubspec.yaml
      # lo declara como asset: sin el archivo, flutter analyze/test fallan.
      - name: Preparar .env
        run: cp .env.example .env

      - name: Dependencias
        run: flutter pub get

      - name: Código generado (Isar)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analizar
        run: flutter analyze

      - name: Testear
        run: flutter test

      - name: Formato
        run: dart format --output=none --set-exit-if-changed lib test
