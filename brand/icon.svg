<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Cinemapedia">
  <!-- Tile de la app. Mantener el glifo en sincronía con brand/mark.svg. -->
  <rect width="512" height="512" rx="112" fill="#1E293B"/>
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none"
        stroke="#94A3B8" stroke-opacity="0.28" stroke-width="6"/>
  <g transform="rotate(-6 256 256)">
    <g mask="url(#clapper)">
      <!-- Claqueta: cuerpo + banda superior rayada (los cortes del mask
           dejan ver el tile, como las franjas de una claqueta real). -->
      <rect x="104" y="138" width="304" height="236" rx="28" fill="#B3261E"/>
    </g>
  </g>
  <defs>
    <clipPath id="clapper-band">
      <rect x="80" y="96" width="400" height="130"/>
    </clipPath>
    <mask id="clapper">
      <rect x="104" y="138" width="304" height="236" rx="28" fill="#fff"/>
      <g stroke="#000" stroke-width="30" clip-path="url(#clapper-band)">
        <line x1="212" y1="96" x2="128" y2="250"/>
        <line x1="302" y1="96" x2="218" y2="250"/>
        <line x1="392" y1="96" x2="308" y2="250"/>
      </g>
    </mask>
  </defs>
</svg>
