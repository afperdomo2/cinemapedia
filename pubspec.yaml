name: cinemapedia
description: "Catálogo de películas de TMDB: cartelera, populares, favoritos y trailers."
publish_to: "none"
version: 0.2.0

environment:
  sdk: ">=3.4.3 <4.0.0"

dependencies:
  cached_network_image: ^4.0.7
  card_swiper: ^3.0.1
  dio: ^5.8.0+1
  flutter:
    sdk: flutter
  flutter_dotenv: ^5.2.1
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.0
  intl: ^0.20.2
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  media_kit: ^1.2.6
  media_kit_libs_linux: ^1.2.1
  media_kit_libs_macos_video: ^1.1.4
  media_kit_libs_windows_video: ^1.0.11
  media_kit_video: ^2.0.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  youtube_explode_dart: ^3.1.0
  youtube_player_flutter: ^8.1.2

dev_dependencies:
  build_runner: ^2.4.11
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  isar_generator: ^3.1.0+1

# Copia local parcheada de card_swiper 3.0.1 (fix del error de precisión al
# redimensionar ventanas en desktop). Ver packages/card_swiper/PATCHES.md
dependency_overrides:
  card_swiper:
    path: packages/card_swiper

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/loaders/
